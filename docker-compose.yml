version: "3.9"
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6375:6379"

  api:
    build: ./api
    volumes:
      - ./api/api.py:/app/api.py
    container_name: api
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

  front:
    build: ./frontend
    container_name: frontend
    ports:
      - "9000:9000"
    depends_on:
      - api
